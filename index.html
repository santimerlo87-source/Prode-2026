<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prode Amigos 2026 🏆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="https://arc-static.glanacion.com.ar/resizer/v2/L5A74X2A4ZHWZOC2E3EXM6YI6Q.JPG?width=400&height=267&quality=80">
    <link rel="apple-touch-icon" href="https://arc-static.glanacion.com.ar/resizer/v2/L5A74X2A4ZHWZOC2E3EXM6YI6Q.JPG?width=400&height=267&quality=80">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PRODE 2026">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        input { color: white; background: #0f172a; border-radius: 8px; }
        .titulo-seccion { color: #eab308; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em; margin-bottom: 0.75rem; border-left: 4px solid #eab308; padding-left: 8px; }
        .btn-penales-off { background: #334155; color: #94a3b8; }
        .btn-penales-on { background: #eab308; color: #000; font-weight: bold; }
    </style>
</head>
<body>
    <div id="app" class="max-w-md mx-auto p-4">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <h1 class="text-2xl font-bold text-yellow-500 italic uppercase">Prode 2026</h1>
            <div id="userInfo" class="text-right text-[10px] text-slate-400 uppercase"></div>
        </div>

        <div class="flex gap-1 mb-6 overflow-x-auto pb-2">
            <button onclick="showTab('partidos')" class="flex-none bg-slate-700 px-3 py-2 rounded font-bold text-[9px] uppercase">Partidos</button>
            <button onclick="showTab('ranking')" class="flex-none bg-slate-700 px-3 py-2 rounded font-bold text-[9px] uppercase">Ranking</button>
            <button onclick="showTab('aura')" class="flex-none bg-indigo-700 px-3 py-2 rounded font-bold text-[9px] uppercase">AURA ✨</button>
            <button id="adminBtn" onclick="showTab('admin')" class="hidden flex-none bg-red-600 px-3 py-2 rounded font-bold text-[9px] uppercase">Admin</button>
        </div>

        <div id="tab-content" class="min-h-[200px]"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const p1 = "AIzaSyC4w9O"; const p2 = "eswyNimznnNL6s"; const p3 = "AUXAtrb80Kft9E";
        const firebaseConfig = { apiKey: p1+p2+p3, authDomain: "predicciones-2026.firebaseapp.com", projectId: "predicciones-2026", storageBucket: "predicciones-2026.firebasestorage.app", messagingSenderId: "226705370126", appId: "1:226705370126:web:04dfa828c687c9ee5ee05f" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const PUNTOS_BASE = { "Kako": { pts: 57, ex: 10 }, "Esculapio": { pts: 54, ex: 6 }, "Popa": { pts: 50, ex: 8 }, "Fer": { pts: 49, ex: 8 }, "Bauti": { pts: 22, ex: 5 } };
        const USERS = Object.keys(PUNTOS_BASE);
        let currentUser = localStorage.getItem('prode_user');

        window.login = (name) => { localStorage.setItem('prode_user', name); location.reload(); };

        window.togglePenalesInput = (id) => {
            const div = document.getElementById(`div-p-${id}`);
            const btn = document.getElementById(`btn-p-${id}`);
            if (div.classList.contains('hidden')) {
                div.classList.remove('hidden');
                btn.className = "w-full mt-2 p-1 rounded text-[10px] btn-penales-on";
            } else {
                div.classList.add('hidden');
                btn.className = "w-full mt-2 p-1 rounded text-[10px] btn-penales-off";
                document.getElementById(`p-${id}`).value = "";
            }
        };

        window.showTab = async (tab) => {
            const container = document.getElementById('tab-content');
            container.innerHTML = `<div class="text-center py-10 text-slate-500 text-[10px] uppercase">Cargando...</div>`;

            if (tab === 'partidos') {
                const qP = await getDocs(collection(db, "partidos"));
                const todos = qP.docs.map(d => ({id: d.id, ...d.data()}));
                const qPre = await getDocs(query(collection(db, "predicciones"), where("user", "==", currentUser)));
                const misPreds = {};
                qPre.forEach(d => { misPreds[d.data().partidoId] = d.data(); });

                container.innerHTML = `<div class="titulo-seccion">Pronosticar</div>` + todos.filter(p => !p.finalizado).map(p => {
                    const yaVoto = misPreds[p.id];
                    const tienePenalesVotado = yaVoto?.usaPenales;
                    return `
                    <div class="card">
                        <div class="flex justify-between mb-2">
                            <span class="text-[9px] text-blue-400 font-bold uppercase">${p.torneo}</span>
                            <span class="text-[8px] text-green-500 font-bold uppercase">Abierto</span>
                        </div>
                        <div class="flex justify-between items-center mb-4">
                            <span>${p.local}</span>
                            <div class="flex gap-2">
                                <input id="l-${p.id}" type="number" value="${yaVoto ? yaVoto.gl : ''}" class="w-10 h-10 text-center border border-slate-600 font-bold">
                                <input id="v-${p.id}" type="number" value="${yaVoto ? yaVoto.gv : ''}" class="w-10 h-10 text-center border border-slate-600 font-bold">
                            </div>
                            <span>${p.visitante}</span>
                        </div>
                        ${p.eliminacion ? `
                            <button id="btn-p-${p.id}" onclick="togglePenalesInput('${p.id}')" class="w-full p-1 rounded text-[10px] ${tienePenalesVotado ? 'btn-penales-on' : 'btn-penales-off'}">¿PENALES?</button>
                            <div id="div-p-${p.id}" class="${tienePenalesVotado ? '' : 'hidden'} mt-2 p-2 bg-slate-800/50 rounded-lg text-center">
                                <p class="text-[8px] text-slate-400 mb-1 uppercase">¿Quién avanza?</p>
                                <select id="p-${p.id}" class="bg-slate-900 text-[10px] p-1 rounded border border-slate-600">
                                    <option value="">- Seleccionar -</option>
                                    <option value="L" ${yaVoto?.penales === 'L' ? 'selected' : ''}>${p.local}</option>
                                    <option value="V" ${yaVoto?.penales === 'V' ? 'selected' : ''}>${p.visitante}</option>
                                </select>
                            </div>
                        ` : ''}
                        <button onclick="savePred('${p.id}')" class="w-full mt-4 bg-yellow-600 p-2 rounded text-xs font-bold uppercase">Guardar</button>
                    </div>`;
                }).join('');
            }

            if (tab === 'ranking') {
                const pSnap = await getDocs(collection(db, "partidos"));
                const predSnap = await getDocs(collection(db, "predicciones"));
                const partidosFin = pSnap.docs.map(d => ({id: d.id, ...d.data()})).filter(p => p.finalizado);
                const preds = predSnap.docs.map(d => d.data());
                let ranking = USERS.map(u => ({ nombre: u, pts: PUNTOS_BASE[u].pts }));

                partidosFin.forEach(p => {
                    preds.filter(pr => pr.partidoId === p.id).forEach(pr => {
                        const i = USERS.indexOf(pr.user);
                        if (i === -1) return;
                        const ex = pr.gl == p.golesL && pr.gv == p.golesV;
                        const gan = (pr.gl > pr.gv && p.golesL > p.golesV) || (pr.gl < pr.gv && p.golesL < p.golesV) || (pr.gl == pr.gv && p.golesL == p.golesV);
                        if(ex) ranking[i].pts += 3; else if(gan) ranking[i].pts += 1;
                        if(p.eliminacion && p.huboPenales && pr.usaPenales && pr.penales === p.ganadorPenales) ranking[i].pts += 1;
                    });
                });
                ranking.sort((a,b) => b.pts - a.pts);
                container.innerHTML = `<div class="titulo-seccion">Ranking</div><div class="card"><table class="w-full text-xs">${ranking.map((t, i) => `<tr class="border-b border-slate-700/50"><td class="py-3">${i+1}. ${t.nombre}</td><td class="text-right font-bold text-yellow-500">${t.pts}</td></tr>`).join('')}</table></div>`;
            }

            if (tab === 'admin') {
                const q = await getDocs(collection(db, "partidos"));
                const pendientes = q.docs.map(d => ({id: d.id, ...d.data()})).filter(p => !p.finalizado);
                container.innerHTML = `
                <div class="card border-red-500">
                    <h3 class="text-xs font-bold mb-3 uppercase tracking-tighter">Nuevo Partido</h3>
                    <input id="newL" placeholder="Local" class="w-full p-2 mb-2 text-sm">
                    <input id="newV" placeholder="Visitante" class="w-full p-2 mb-2 text-sm">
                    <div class="flex items-center gap-2 mb-4">
                        <input type="checkbox" id="isElim"> <label class="text-[10px] uppercase">Eliminación Directa</label>
                    </div>
                    <button onclick="addPartido()" class="w-full bg-red-600 p-2 rounded font-bold text-xs uppercase">Publicar</button>
                </div>
                ${pendientes.map(p => `
                <div class="card">
                    <p class="text-[10px] font-bold mb-3 uppercase text-yellow-500">${p.local} vs ${p.visitante}</p>
                    <div class="flex gap-2 items-center">
                        <input id="resL-${p.id}" type="number" placeholder="L" class="w-12 p-2 text-center border border-slate-700">
                        <input id="resV-${p.id}" type="number" placeholder="V" class="w-12 p-2 text-center border border-slate-700">
                        ${p.eliminacion ? `
                            <div class="flex flex-col gap-1">
                                <label class="text-[8px] uppercase">¿Hubo penales?</label>
                                <input type="checkbox" id="hP-${p.id}">
                                <select id="resP-${p.id}" class="bg-slate-900 text-[10px] p-1 border border-red-500 rounded"><option value="L">Pasa L</option><option value="V">Pasa V</option></select>
                            </div>
                        ` : ''}
                        <button onclick="finalizarPartido('${p.id}', ${p.eliminacion})" class="flex-1 bg-green-700 rounded text-[9px] font-bold p-2 uppercase">Cerrar</button>
                    </div>
                </div>`).join('')}`;
            }
        };

        window.savePred = async (id) => {
            const gl = document.getElementById(`l-${id}`).value;
            const gv = document.getElementById(`v-${id}`).value;
            const usaP = !document.getElementById(`div-p-${id}`).classList.contains('hidden');
            const pen = usaP ? document.getElementById(`p-${id}`).value : "";
            if (gl === "" || gv === "") return alert("Faltan goles.");
            if (usaP && !pen) return alert("Elegí quién pasa por penales.");
            await setDoc(doc(db, "predicciones", `${currentUser}_${id}`), { user: currentUser, partidoId: id, gl: parseInt(gl), gv: parseInt(gv), usaPenales: usaP, penales: pen });
            alert("Guardado!");
        };

        window.addPartido = async () => {
            const l = document.getElementById('newL').value; const v = document.getElementById('newV').value;
            const elim = document.getElementById('isElim').checked;
            await addDoc(collection(db, "partidos"), { local: l, visitante: v, finalizado: false, eliminacion: elim, torneo: "Competencia" });
            showTab('admin');
        };

        window.finalizarPartido = async (id, esElim) => {
            const gl = document.getElementById(`resL-${id}`).value; const gv = document.getElementById(`resV-${id}`).value;
            const hp = esElim ? document.getElementById(`hP-${id}`).checked : false;
            const gp = esElim && hp ? document.getElementById(`resP-${id}`).value : "";
            await updateDoc(doc(db, "partidos", id), { golesL: parseInt(gl), golesV: parseInt(gv), finalizado: true, huboPenales: hp, ganadorPenales: gp });
            showTab('admin');
        };

        if (!currentUser) {
            document.getElementById('tab-content').innerHTML = `<div class="bg-slate-800 p-6 rounded-xl border border-slate-700"><div class="grid grid-cols-1 gap-3">${USERS.map(u => `<button onclick="login('${u}')" class="bg-slate-700 p-4 rounded-lg font-bold uppercase text-xs">${u}</button>`).join('')}</div></div>`;
        } else {
            document.getElementById('userInfo').innerHTML = `JUGADOR: <b class="text-white">${currentUser.toUpperCase()}</b>`;
            if(currentUser === "Esculapio") document.getElementById('adminBtn').classList.remove('hidden');
            showTab('partidos');
        }
    </script>
</body>
</html>
